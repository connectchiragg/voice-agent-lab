<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0b0c0f">
<title>Offline · VALR</title>
<style>
  :root { color-scheme: dark; --char: #0b0c0f; --bone: #eceef2; --ash: #8d95a2; --signal-fill: #8b8cfb; --on-signal: #0b0c0f; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --char: #f6f7f9; --bone: #0e1116; --ash: #5f6875; --signal-fill: #4f46e5; --on-signal: #fff; } }
  html, body { height: 100%; margin: 0; background: var(--char); color: var(--bone);
               font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; }
  img { width: 64px; height: 64px; margin: 0 auto; border-radius: 14px; }
  h1 { font: 400 2rem/1.1 "Instrument Serif", Georgia, serif; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--ash); }
  button { justify-self: center; margin-top: 8px; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--signal-fill);
           color: var(--on-signal); font-weight: 500; font: inherit; cursor: pointer; }
</style>
</head><body>
<main>
  <img src="/static/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>VALR needs a connection. Nothing private is stored on this phone.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body></html>
