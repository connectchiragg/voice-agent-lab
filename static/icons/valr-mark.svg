<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- VALR's mark: a lit indigo orb on a night-sky square (the top bar's .brand-mark). scripts/make_icons.py draws the PNGs. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="75%"><stop offset="0" stop-color="#16204a"/><stop offset="1" stop-color="#060914"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset=".55" stop-color="#6366f1" stop-opacity=".55"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" cx="41%" cy="38%" r="70%"><stop offset="0" stop-color="#c7c8ff"/><stop offset=".35" stop-color="#6f70f5"/><stop offset="1" stop-color="#2b2d8f"/></radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#sky)"/>
  <circle cx="50" cy="50" r="51" fill="url(#glow)"/>
  <circle cx="50" cy="50" r="29" fill="url(#orb)"/>
</svg>
