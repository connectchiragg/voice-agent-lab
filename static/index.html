<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Agent Lab</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/chat.js" defer></script>
    <script src="/static/speech.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Voice Agent Lab</h1>
      <p>Your conversation is saved and can resume after refreshes or server restarts.</p>
      <button id="new-conversation" type="button">New conversation</button>
      <p id="status" role="status">Connecting…</p>
      <section id="messages" role="log" aria-label="Chat messages"></section>
      <div class="speech-controls">
        <button id="record" type="button">Record</button>
        <span id="speech-status" role="status">Record up to 60 seconds, then edit and send the transcript.</span>
      </div>
      <form id="chat-form">
        <fieldset id="message-controls">
          <label for="message">Message</label>
          <div class="composer">
            <input id="message" autocomplete="off" required placeholder="Hello" />
            <button type="submit">Send</button>
          </div>
        </fieldset>
      </form>
    </main>
  </body>
</html>
