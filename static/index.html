<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Agent Lab</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/voice.js" type="module"></script>
  </head>
  <body>
    <main>
      <h1>Voice Agent Lab</h1>
      <p>Continuous two-way audio. Speech detection is diagnostic only. No saved history.</p>
      <p id="status" role="status">Ready to start a call.</p>
      <section id="messages" role="log" aria-label="Chat messages"></section>
      <div class="speech-controls">
        <button id="call" type="button">Start call</button>
        <span id="diagnostics">Speech diagnostics will appear here.</span>
      </div>
    </main>
  </body>
</html>
