<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Agent Lab</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module">
      // WebRTC by default; ?transport=ws keeps the WebSocket client for one release.
      const transport = new URLSearchParams(location.search).get("transport");
      import(transport === "ws" ? "/static/voice.js" : "/static/voice-webrtc.js");
    </script>
  </head>
  <body>
    <main>
      <h1>Voice Agent Lab</h1>
      <p>Speak naturally; the assistant replies when you finish your turn.</p>
      <p id="status" role="status">Ready to start a call.</p>
      <section id="messages" role="log" aria-label="Chat messages"></section>
      <div class="speech-controls">
        <button id="call" type="button">Start call</button>
        <span id="metrics"></span>
      </div>
    </main>
  </body>
</html>
