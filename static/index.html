<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Agent Lab</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/voice.js" type="module"></script>
  </head>
  <body>
    <main>
      <h1>Voice Agent Lab</h1>
      <p>Record, speak, then Stop. The reply plays automatically. Transcripts are saved and shown below.</p>
      <button id="new-conversation" type="button">New conversation</button>
      <p id="status" role="status">Connecting…</p>
      <section id="messages" role="log" aria-label="Chat messages"></section>
      <div class="speech-controls">
        <button id="record" type="button" disabled>Record</button>
        <span>Up to 60 seconds. English speech replies up to 200 characters.</span>
      </div>
    </main>
  </body>
</html>
