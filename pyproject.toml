[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-lab"
version = "0.1.0"
description = "Learn a voice agent by first building a WebSocket chat application."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "google-genai>=1,<3", "groq>=1.7,<2", "python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4", "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
