# OPTIONAL, not enabled: builds the app and worker images for linux/arm64 on GitHub's arm64
# runner and pushes them to GHCR (private), so the VM only pulls (deploy/deploy-pull.sh).
# Manual trigger only (Actions tab > images > Run workflow); nothing runs on push.
# Before using: the repo's history must be PII-scrubbed and the owner must approve the push.
# Cost (private repo): runner minutes come out of the plan's included Actions minutes
# (2,000/month on Free); GHCR private storage counts against the packages quota (500 MB on
# Free). The images are ~470 MB compressed, so prune old versions or expect storage charges.
name: images
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        default: valr-interviews
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker-bake.hcl: the same two targets the VM builds; the GitHub cache keeps the
      # dependency layers, so a code-only change rebuilds in about a minute.
      - uses: docker/bake-action@v6
        with:
          source: .
          push: true
          set: |
            *.platform=linux/arm64
            app.tags=ghcr.io/${{ steps.meta.outputs.owner }}/voice-agent-lab:${{ steps.meta.outputs.sha }}
            worker.tags=ghcr.io/${{ steps.meta.outputs.owner }}/voice-agent-lab-worker:${{ steps.meta.outputs.sha }}
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,scope=app,mode=max
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,scope=worker,mode=max
